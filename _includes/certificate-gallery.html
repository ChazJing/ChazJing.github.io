<section class="certificate-gallery" aria-label="荣誉证书" data-certificate-gallery>
  <div class="certificate-track" id="certificate-track" tabindex="0" aria-label="荣誉证书">
    {% for certificate in site.data.certificates %}
    <figure class="certificate-card" data-certificate>
      <a class="certificate-open" href="{{ certificate.image | relative_url }}" target="_blank" rel="noopener" data-title="{{ certificate.title | escape }}" data-period="{{ certificate.period | escape }}" data-kind="{{ certificate.kind | escape }}" aria-label="查看证书大图">
        <span class="certificate-image-frame"><img src="{{ certificate.thumbnail | relative_url }}" alt="{{ certificate.period }} · {{ certificate.title }}" width="{{ certificate.width }}" height="{{ certificate.height }}" loading="lazy" decoding="async" draggable="false"></span>
      </a>
    </figure>
    {% endfor %}
  </div>
</section>
<dialog class="certificate-dialog" aria-labelledby="certificate-dialog-title"><div class="certificate-dialog-shell"><header class="certificate-dialog-header"><div><p id="certificate-dialog-meta"></p><h3 id="certificate-dialog-title">证书大图</h3></div><button type="button" data-viewer-close aria-label="关闭证书大图">关闭 ×</button></header><div class="certificate-dialog-toolbar"><button type="button" data-viewer-prev aria-label="查看上一张证书">← 上一张</button><span data-viewer-count aria-live="polite"></span><button type="button" data-viewer-next aria-label="查看下一张证书">下一张 →</button><button type="button" data-viewer-zoom aria-pressed="false">放大细看</button><a data-viewer-original target="_blank" rel="noopener">打开原尺寸图片 ↗</a></div><div class="certificate-image-stage" tabindex="0" aria-label="证书大图，放大后可滚动查看"><img data-viewer-image alt="" draggable="false"></div></div></dialog>
